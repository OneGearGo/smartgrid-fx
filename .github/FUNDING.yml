# 打赏/赞助配置
# 收款渠道（按可用性配置）：
#   1. GitHub Sponsors —— 需绑定 PayPal（你已有 PayPal 账户）
#   2. 爱发电（afdian.com）—— 国内备用渠道
#   3. 微信/支付宝赞赏码 —— 放到 docs/ 目录，在 README 里展示
# 说明：GitHub 仓库页右上角的 Sponsor 按钮认 github/custom 字段。

github: OneGearGo    # 在 GitHub 设置里开启 Sponsors 并绑定 PayPal 后生效
custom:
  - "https://afdian.com/a/你的爱发电ID"   # 可选：爱发电主页
