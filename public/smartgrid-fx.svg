<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景：深 navy 黑底 -->
  <rect width="64" height="64" rx="12" fill="#0b0b10"/>
  <!-- 网格线（桃色主色）：水平等距网格 = 网格交易 -->
  <g stroke="#f2c09a" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <line x1="10" y1="18" x2="54" y2="18"/>
    <line x1="10" y1="28" x2="54" y2="28"/>
    <line x1="10" y1="38" x2="54" y2="38"/>
    <line x1="10" y1="48" x2="54" y2="48"/>
  </g>
  <!-- 垂直网格线（青色，淡） -->
  <g stroke="#6fc7ea" stroke-width="1" stroke-linecap="round" opacity="0.45">
    <line x1="20" y1="10" x2="20" y2="54"/>
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="44" y1="10" x2="44" y2="54"/>
  </g>
  <!-- 上升趋势线（薄荷绿=盈利）：阶梯式上行 -->
  <polyline points="12,48 22,44 22,38 32,34 32,28 44,22 52,18"
            fill="none" stroke="#7ed6a4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 趋势终点箭头 -->
  <polygon points="52,13 56,18 49,19" fill="#7ed6a4"/>
  <!-- 成交点（玫瑰红=亏损 / 薄荷绿=盈利 的格点） -->
  <circle cx="22" cy="44" r="2.2" fill="#f26d8d"/>
  <circle cx="32" cy="34" r="2.2" fill="#f26d8d"/>
  <circle cx="44" cy="22" r="2.2" fill="#7ed6a4"/>
  <circle cx="52" cy="18" r="2.2" fill="#7ed6a4"/>
  <!-- FX 角标（琥珀色） -->
  <text x="10" y="13" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#ffb877">FX</text>
</svg>
